apply plugin: 'net.neoforged.moddev'
// SS13 Framework's API plugin: the jar is a GAMELIBRARY whose module is the API's package, so no mod
// lists this project's source set. check runs its checks (nothing outside the package, no
// dependency but Minecraft and NeoForge, strict javadoc, and apiCompat against the release that
// api_baseline_version in gradle.properties names), and it publishes to Maven Central as
// io.github.west3436:expedition-api with its sources and javadoc jars.
apply plugin: 'io.github.west3436.ss13.api'

ss13 { apiPackage = 'io.github.west3436.expedition.api' }

// Independent semver. -PapiSnapshot=true (or ORG_GRADLE_PROJECT_apiSnapshot=true) builds
// <api_version>-SNAPSHOT for the Central snapshots repository. The mod's nested API keeps its range
// either way.
def snapshot = providers.gradleProperty('apiSnapshot').getOrElse('false').toBoolean()
version = snapshot ? "${api_version}-SNAPSHOT" : api_version

mavenPublishing {
    pom {
        name = 'Expedition API'
        description = 'The public API of Expedition, planetary exploration for NeoForge built on ZAS³. ' +
                'Mods may bundle it (jar-in-jar) and call it whether or not Expedition is installed.'
    }
}

// Unit tests of the API's pure logic. Minecraft's classes are on the test
// classpath, but the game is never bootstrapped.
neoForge {
    addModdingDependenciesTo(sourceSets.test)
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
}
