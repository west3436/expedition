modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"
issueTrackerURL = "https://github.com/west3436/expedition/issues"

[[mods]]
modId = "expedition"
version = "${mod_version}"
displayName = "Expedition"
authors = "west3436"
description = '''
Planetary exploration built on ZAS³'s atmospherics: shuttles, a Space dimension
and planets defined in datapacks.
'''

[[mixins]]
config = "expedition.mixins.json"

[[dependencies.expedition]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.expedition]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version}]"
ordering = "NONE"
side = "BOTH"

# ZAS³ is the one required mod: the air of every planet and every cabin is its simulation.
[[dependencies.expedition]]
modId = "zas"
type = "required"
versionRange = "[${zas_floor_version},)"
ordering = "AFTER"
side = "BOTH"
