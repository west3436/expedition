name: Move benchmark

# What a move costs by the size of its box (#8): boxes of 8 to 64 blocks a side, empty and full,
# moved within the Overworld and into the Nether. The benchmark is its own GameTest namespace, which
# CI's GameTest runs never enable, so it runs only from the Actions tab, and on a PR that changes the
# benchmark itself, as the Release workflow does. The results are the job summary and the move-bench
# artifact.
on:
  workflow_dispatch:
    inputs:
      reps:
        description: How many times each case runs
        default: "3"
      sides:
        description: The boxes' sides, comma-separated
        default: "8,16,32,64"
  pull_request:
    paths:
      - ".github/workflows/move-bench.yml"
      - "expedition/src/gametest/java/io/github/west3436/expedition/gametest/MoveBench.java"

permissions:
  contents: read

jobs:
  bench:
    name: Move benchmark
    runs-on: ubuntu-latest
    env:
      REPS: ${{ inputs.reps || '3' }}
      SIDES: ${{ inputs.sides || '8,16,32,64' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Check the inputs
        shell: bash
        run: |
          [[ "$REPS" =~ ^[1-9][0-9]?$ ]] || { echo "::error::reps must be a number from 1 to 99"; exit 1; }
          [[ "$SIDES" =~ ^[0-9]+(,[0-9]+)*$ ]] || { echo "::error::sides must be numbers separated by commas"; exit 1; }
      - name: Runner
        shell: bash
        run: |
          {
            echo "### Runner"
            echo '```'
            lscpu | grep -E '^(Model name|CPU\(s\)|Thread\(s\) per core|CPU max MHz)'
            free -h | head -2
            java -version 2>&1 | head -1
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      # The task can succeed without the server ever starting, so the log must also say that the
      # benchmark's one test passed.
      - name: Benchmark
        timeout-minutes: 60
        shell: bash
        run: |
          ./gradlew :expedition:runGameTestServer -Pbench=true -Pbench.reps="$REPS" -Pbench.sides="$SIDES" --stacktrace | tee bench.log
          grep -E "Enabled Gametest Namespaces: \[expedition_bench\]" bench.log
          grep -E "All 1 required tests passed" bench.log
      - name: Summary
        if: always()
        shell: bash
        run: |
          csv=expedition/build/gametestRun/move-bench.csv
          if [ -f "$csv" ]; then
            { echo "### Move cost (median of $REPS runs; worst ticks are the worst run)"; echo; python3 scripts/move_bench_summary.py "$csv"; } | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          grep -h "MOVE_BENCH " bench.log | sed 's/.*MOVE_BENCH //' > move-bench-all.csv || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: move-bench
          path: |
            expedition/build/gametestRun/move-bench.csv
            move-bench-all.csv
            bench.log
          if-no-files-found: warn
