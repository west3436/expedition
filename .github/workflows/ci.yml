name: CI

# On SS13 Framework's shared workflow, which ZAS³, NT Engineering and the
# framework call too.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: west3436/ss13-framework/.github/workflows/shared-build.yml@v0.3.0
    with:
      # check, inside build, runs checkCredits (asset provenance), Spotless and
      # the API's checks: its packages, its dependencies, its javadoc and
      # :expedition-api:apiCompat.
      #
      # Then the mod's GameTests on a dedicated server, beside the ZAS³ release
      # jar. There is one GameTest server today.
      gametests: |
        1 runGameTestServer
      # Snapshot of the API on the Central Portal, after a green build on main.
      snapshot: ":expedition-api:publishToMavenCentral -PapiSnapshot=true"
    secrets:
      CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
      CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
