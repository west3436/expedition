name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Asset provenance (CREDITS)
        run: python3 scripts/check_credits.py
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      # check, inside build, runs the API's checks: its packages, its
      # dependencies, its javadoc and :expedition-api:apiCompat.
      - name: Build
        run: ./gradlew build --stacktrace
      # The mod's GameTests on a dedicated server, beside the ZAS³ release jar.
      # The task can succeed without a server ever starting, so the log must also
      # say that the tests passed, once for each server. There is one today.
      - name: GameTests (dedicated server)
        timeout-minutes: 20
        shell: bash
        run: |
          ./gradlew runGameTestServer --stacktrace | tee gametests.log
          passed=$(grep -cE "All [0-9]+ required tests passed" gametests.log || true)
          if [ "$passed" -ne 1 ]; then
            echo "::error::Expected 1 GameTest server to report that its tests passed, but $passed did."
            exit 1
          fi

  # Snapshot of the API on the Central Portal, after a green build on main.
  # Never on PRs: they don't get the secrets.
  publish-api-snapshot:
    name: Publish API snapshot
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_PASSWORD }}
      # Optional: Central doesn't require signed snapshots. The build signs
      # when a key is set.
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
    steps:
      - name: Check for Central credentials
        id: creds
        run: |
          if [ -n "$ORG_GRADLE_PROJECT_mavenCentralUsername" ] && [ -n "$ORG_GRADLE_PROJECT_mavenCentralPassword" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CENTRAL_USERNAME or CENTRAL_PASSWORD is not set; skipping the API snapshot."
          fi
      - uses: actions/checkout@v7
        if: steps.creds.outputs.present == 'true'
      - uses: actions/setup-java@v6
        if: steps.creds.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        if: steps.creds.outputs.present == 'true'
      - name: Publish the snapshot
        if: steps.creds.outputs.present == 'true'
        run: ./gradlew :expedition-api:publishToMavenCentral -PapiSnapshot=true --stacktrace

  docs:
    name: Docs links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check relative links and anchors
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --include-fragments --no-progress './**/*.md'
          fail: true
