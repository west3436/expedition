name: Adapter tests

# The GameTests on a server with each mod Expedition adapts to, in the versions
# it supports. The main CI runs them once, with the newest ZAS³. The rest run
# here: on a PR that touches an adapter, the public API or the versions,
# nightly on main, or from the Actions tab.
#
# ZAS³ is the first such mod, and the only one so far. Each compat-* adapter
# adds its rows as it lands, as in ZAS³'s own workflow of this name.
on:
  workflow_dispatch:
  schedule:
    - cron: "43 4 * * *"
  pull_request:
    paths:
      - "compat-*/**"
      - "expedition/src/main/java/io/github/west3436/expedition/compat/**"
      - "expedition-api/**"
      - "expedition/build.gradle"
      - "build.gradle"
      - "gradle.properties"
      - ".github/workflows/compat-adapters.yml"

permissions:
  contents: read

jobs:
  adapter:
    name: ${{ matrix.adapter }}
    strategy:
      fail-fast: false
      matrix:
        # One row per adapter, or per version of its target that it is tested
        # with: its name, and the task that runs its GameTests, with any
        # arguments.
        include:
          # The oldest ZAS³ that Expedition supports, which neoforge.mods.toml
          # asks for, and the newest. Both are compiled against that release's
          # API and run with its jar. While they are the same release, the two
          # rows are the same run.
          - adapter: zas (oldest supported)
            task: ":expedition:runGameTestServer -Pzas.version=floor"
          - adapter: zas (newest)
            task: ":expedition:runGameTestServer"
          # Expedition needs ZAS³'s simulation, not its content: with the
          # content mod switched off, the game starts and the tests pass.
          - adapter: zas (content off)
            task: ":expedition:runGameTestServer -Pcontent=off"
    uses: west3436/ss13-framework/.github/workflows/shared-gametests.yml@v0.3.0
    with:
      task: ${{ matrix.task }}
      # A content-off row means nothing unless the content was off, which
      # ZAS³'s content mod logs as it loads.
      log-must-contain: ${{ contains(matrix.task, '-Pcontent=off') && 'content is off in zas_atmos-startup.toml' || '' }}

  # A ZAS³ older than the oldest supported: the game must refuse to load
  # Expedition beside it, naming the version it needs, rather than start and
  # fail later. 1.2.0 is the newest release before the floor, 1.3.0, which
  # first nests SS13 Framework. The mod compiles against the newest ZAS³ and
  # runs with 1.2.0's jar, checked against that release's SHA256SUMS.txt.
  older:
    name: zas (older than supported)
    runs-on: ubuntu-latest
    env:
      OLDER: "1.2.0"
      OLDER_SHA256: f86318c1d4b553500aa33ea5aa7b659dadc31b348dfabb76ecd9b55f9cc24d2a
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: GameTests with ZAS³ ${{ env.OLDER }}, which are refused
        timeout-minutes: 20
        shell: bash
        run: |
          floor=$(sed -n 's/^zas_floor_version=//p' gradle.properties)
          ./gradlew :expedition:runGameTestServer -Pzas.run="$OLDER" -Pzas.run.sha256="$OLDER_SHA256" --stacktrace | tee gametests.log || true
          if grep -qE "All [0-9]+ required tests passed" gametests.log; then
            echo "::error::The GameTests ran with ZAS³ $OLDER, which is older than zas_floor_version $floor."
            exit 1
          fi
          refusal="Mod expedition requires zas $floor or above"
          if ! grep -qF -- "$refusal" gametests.log || ! grep -qF -- "Currently, zas is $OLDER" gametests.log; then
            echo "::error::The log doesn't say: $refusal / Currently, zas is $OLDER"
            exit 1
          fi
          echo "Refused, as it should be: $refusal; currently, zas is $OLDER."
