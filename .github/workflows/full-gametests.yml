name: Full GameTests

# Every project's GameTests, nightly on main or from the Actions tab. In ZAS³
# this is where the repeats that each PR leaves out run. Expedition has one
# GameTest server so far, so today this repeats CI's run; the fuller runs go
# here as projects are added.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: read

jobs:
  gametests:
    name: GameTests of every project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      # The task can succeed without the server ever starting, so the log must
      # also say that the tests passed, and that Expedition's were among them.
      - name: GameTests
        timeout-minutes: 20
        shell: bash
        run: |
          ./gradlew runGameTestServer --stacktrace | tee gametests.log
          grep -E "Enabled Gametest Namespaces: \[expedition\]" gametests.log
          grep -E "All [0-9]+ required tests passed" gametests.log
