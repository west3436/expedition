name: Full GameTests

# Every project's GameTests, nightly on main or from the Actions tab. In ZAS³
# this is where the repeats that each PR leaves out run. Expedition has one
# GameTest server so far, so today this repeats CI's run; the fuller runs go
# here as projects are added.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: read

jobs:
  gametests:
    name: GameTests of every project
    uses: west3436/ss13-framework/.github/workflows/shared-gametests.yml@v0.3.0
    with:
      task: runGameTestServer
      # Expedition's GameTests must be among those that ran.
      log-must-match: 'Enabled Gametest Namespaces: \[expedition\]'
