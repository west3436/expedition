name: Release

# A tag v<mod_version> on a commit on main builds the jars and attaches them to
# a draft GitHub release, which a maintainer reads and then publishes. A 0.x
# version is marked as a pre-release. A PR that changes this file builds the
# same jars without releasing anything, so the workflow is tried before a tag
# needs it.
#
# Assets: the Expedition jar, which nests the API, and the API jar with its
# sources and javadoc jars for mod developers.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml"]

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
    uses: west3436/ss13-framework/.github/workflows/shared-release.yml@v0.3.0
    with:
      title: Expedition
      build: ":expedition:jar :expedition-api:jar :expedition-api:sourcesJar :expedition-api:plainJavadocJar"
      assets: |
        expedition/build/libs/expedition-{mod_version}.jar
        expedition-api/build/libs/expedition-api-{api_version}.jar
        expedition-api/build/libs/expedition-api-{api_version}-sources.jar
        expedition-api/build/libs/expedition-api-{api_version}-javadoc.jar
      notes: |
        For Minecraft 1.21.1 on NeoForge. Needs [ZAS³](https://github.com/west3436/zas-cubed/releases) {zas_floor_version} or newer.

        - **`expedition-{mod_version}.jar`**: Expedition. Install it on the server and on every client, with ZAS³.
        - **`expedition-api-*.jar`**: the API, with its sources and javadoc, for mod developers.

        Guides are on the [wiki]({wiki}).
