name: Publish API to Maven Central

# Releases the API of a released version to Maven Central as
# io.github.west3436:expedition-api, signed, with its sources and javadoc jars.
# A release on Central can never be changed or removed, so nothing starts this
# but a maintainer, from the Actions tab, naming the release's tag. Snapshots
# are published by CI after every green build on main.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag whose API to publish, such as v1.0.0
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish the API
    uses: west3436/ss13-framework/.github/workflows/shared-publish.yml@v0.3.0
    with:
      tag: ${{ inputs.tag }}
      publish: ":expedition-api:publishAndReleaseToMavenCentral"
      what: "expedition-api {api_version}"
    secrets:
      CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
      CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
