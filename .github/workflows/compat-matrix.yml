name: Compatibility matrix

# Every GameTest, with ModernFix, FerriteCore and Lithium on the run's
# classpath, as ZAS³ runs its own. Never on a PR: it runs nightly on main, or
# from the Actions tab.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read

jobs:
  # One of the GameTests checks that the matrix's mods are loaded.
  matrix:
    name: GameTests with the matrix's server mods
    uses: west3436/ss13-framework/.github/workflows/shared-gametests.yml@v0.3.0
    with:
      task: ":expedition:runGameTestServer -Pcompat.matrix=true"
