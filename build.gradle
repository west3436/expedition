// SS13 Framework's Gradle plugins, shared by ZAS³, Expedition, NT Engineering and the framework,
// from Maven Central at the framework's version:
//
//   io.github.west3436.ss13.conventions  each project: Java 21, Spotless (build fails on unformatted
//                                        code; ./gradlew spotlessApply fixes it), NeoForge and
//                                        Parchment from gradle.properties, Central publishing
//   io.github.west3436.ss13.api          expedition-api: a GAMELIBRARY, its checks and publishing
//   io.github.west3436.ss13.credits      this project: checkCredits, which check runs (Python 3)
plugins {
    id 'net.neoforged.moddev' version '2.0.148' apply false
    id 'io.github.west3436.ss13.conventions' version '0.3.0' apply false
    id 'io.github.west3436.ss13.api' version '0.3.0' apply false
    id 'io.github.west3436.ss13.credits' version '0.3.0'
}

subprojects {
    apply plugin: 'io.github.west3436.ss13.conventions'

    group = 'io.github.west3436'
    version = mod_version

    ss13 { githubRepo = 'west3436/expedition' }

    // The API versions the mod's nested API accepts: from this one up to the next version that may
    // break it. That is the next minor while the API is 0.x, and the next major from 1.0.
    ext.api_range = ss13.versionRange(api_version)

    // Expanded into the mod's neoforge.mods.toml.
    tasks.named('processResources', ProcessResources) {
        def props = [
            mod_version      : mod_version,
            api_version      : api_version,
            neo_version      : neo_version,
            minecraft_version: minecraft_version,
            zas_floor_version: zas_floor_version,
        ]
        inputs.properties(props)
        filesMatching('META-INF/neoforge.mods.toml') { expand(props) }
    }
}
