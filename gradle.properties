org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Toolchain: the same Minecraft, NeoForge and Parchment as ZAS³, which Expedition is built on.
# neo_version is what we build and test against, and the mod's minimum: one number, so CI always
# tests the floor. Raising it raises the floor.
minecraft_version=1.21.1
neo_version=21.1.264
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# The mod's version. The API has its own semver: while it is 0.x a new minor version may break it,
# and from 1.0 only a new major version may.
mod_version=0.1.0
api_version=0.1.0

# The last released API version, the baseline for the binary-compatibility check. The check
# downloads expedition-api-<api_baseline_version>.jar from the GitHub release api_baseline_tag and
# refuses a jar whose SHA-256 isn't api_baseline_sha256, which is the jar's line in that release's
# SHA256SUMS.txt. After a release, set all three. With the version empty the check is skipped, as
# it is until the first release.
api_baseline_version=0.1.0
api_baseline_tag=v0.1.0
api_baseline_sha256=a412eb314d8ed6767c4065efe41569c37ccc3272db7a3003f185de2757c3df3c

# ZAS³, the one required mod. zas_version is its newest release: the mod compiles against that
# API by default, and dev runs and GameTests load that jar. zas_floor_version is the oldest
# release Expedition supports, which neoforge.mods.toml asks for: -Pzas.version=floor compiles
# and runs with it, as the Adapter tests workflow does beside the newest. Each jar is the one
# attached to that GitHub release of ZAS³, and the build refuses one whose SHA-256 isn't the
# value here, which is the jar's line in the release's SHA256SUMS.txt.
zas_version=1.3.0
zas_sha256=cd32734e3c8f4d4521c69ebaa093b1c7a7a95c7ed8bfc9a182e6bf5b5de8ebba
zas_floor_version=1.3.0
zas_floor_sha256=cd32734e3c8f4d4521c69ebaa093b1c7a7a95c7ed8bfc9a182e6bf5b5de8ebba

# SS13 Framework, which the mod nests (jar-in-jar), so players never install it: gravity at a
# position, and later the shared parts and windows. The mod compiles against this version, its runs
# load it, and the jar nests it with a range from here up to the next version that may break it
# (the next minor while the framework is 0.x). Mods released together must nest the same minor.
# From Maven Central.
framework_version=0.3.2
